<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{fragments :: html_header(pageTitle=${ad.title} + ' | Desapegaí')}">
    <!-- Título da página dinâmico -->
</head>

<!-- CSS Adicional Leve -->
<style>
    .ad-image {
        max-width: 100%;
        height: auto;
        border-radius: 0.25rem; /* Bordas arredondadas */
        object-fit: cover;
        max-height: 500px; /* Limita a altura máxima da imagem */
    }
    .price-detail {
        font-size: 2rem; /* Preço maior */
        font-weight: bold;
        color: #28a745; /* Verde */
        margin-bottom: 1rem;
    }
    .detail-section {
        border-top: 1px solid #eee; /* Linha separadora sutil */
        padding-top: 1rem;
        margin-top: 1rem;
    }
    #mapa {
        width: 100%; /* Garante que o mapa ocupe a largura do modal */
        height: 400px;
    }
    #botao-mapa {
        background-color: #0d6efd; /* Azul padrão do Bootstrap */
        border-color: #0d6efd;
    }
    #botao-mapa:hover {
        background-color: #0b5ed7;
        border-color: #0a58ca;
    }
</style>

<body>
    <div th:replace="~{fragments :: html_nav}"></div>

    <div class="container mt-5 mb-5">
        <div class="row g-4"> <!-- g-4 adiciona espaçamento entre colunas -->

            <!-- Coluna da Imagem -->
            <div class="col-lg-7 text-center"> <!-- Ocupa mais espaço em telas grandes -->
                 <img th:src="@{/ad-images/{id}/{photos}(id=${ad.id}, photos=${ad.photos})}"
                     class="img-fluid shadow-sm ad-image"
                     th:alt="${ad.title}">
            </div>

            <!-- Coluna de Detalhes -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm h-100"> <!-- Card para agrupar detalhes -->
                    <div class="card-body d-flex flex-column">
                        <!-- Título do Anúncio -->
                        <h1 class="h3 mb-3" th:text="${ad.title}">Título do Anúncio</h1>

                        <!-- Preço -->
                        <p class="price-detail" th:text="'R$ ' + ${#numbers.formatDecimal(ad.price, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>

                        <!-- Descrição -->
                        <div class="detail-section">
                            <h5 class="h6 text-muted mb-2">Descrição</h5>
                            <p th:text="${ad.description}">Descrição detalhada do produto...</p>
                        </div>

                        <!-- Categoria -->
                        <div class="detail-section">
                            <h5 class="h6 text-muted mb-2">Categoria</h5>
                            <p><span class="badge bg-secondary" th:text="${ad.category.name}">Categoria</span></p>
                        </div>

                        <!-- Localização e Data -->
                        <div class="detail-section">
                            <h5 class="h6 text-muted mb-2">Detalhes Adicionais</h5>
                            <!-- Usando data-cep para o script ViaCEP -->
                            <p id="address-display" class="card-text text-muted small mb-1" th:data-cep="${ad.seller.address}" style="display: none;">
                                <i class="bi bi-geo-alt-fill"></i> Carregando localização...
                            </p>
                            <p class="card-text mb-0">
                                <small class="text-muted">
                                    <i class="bi bi-calendar3"></i> Publicado em: <span th:text="${#temporals.format(ad.publicationDate, 'dd/MM/yyyy HH:mm', 'America/Sao_Paulo')}"></span>
                                </small>
                            </p>
                             <p class="card-text mb-0">
                                <small class="text-muted">
                                    <i class="bi bi-person-fill"></i> Vendedor: <span th:text="${ad.seller.username}"></span> <!-- Nome do vendedor -->
                                </small>
                            </p>
                        </div>

                        <!-- Botão do Mapa (no final) -->
                        <div class="mt-auto pt-3"> <!-- Empurra para o final -->
                            <button type="button" id="botao-mapa" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#myModal" sec:authorize="isAuthenticated()">
                                <i class="bi bi-map-fill me-2"></i> Ver Ponto de Encontro no Mapa
                            </button>
                             <p sec:authorize="!isAuthenticated()" class="text-center text-muted small mt-2">
                                <a th:href="@{/login}">Faça login</a> para ver o ponto de encontro.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal do Mapa (Estrutura Mantida) -->
    <div class="modal" id="myModal">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
      
            <!-- Modal Header -->
            <div class="modal-header">
              <h4 class="modal-title">Ponto de Encontro Sugerido</h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
      
            <!-- Modal body -->
            <div class="modal-body">
                <div id="mapa" style="height: 400px; width: 760px; "></div>
            </div>
      
            <!-- Modal footer -->
            <div class="modal-footer">
              <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
            </div>
      
          </div>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAc9-NedwVuG0a_UWAysE5NRK3c7ApeNgQ&callback=inicializarMapa"
    async defer></script>

  <!-- Script CEP para exibir no anuncio -->
  <script>
    var id_local = "address";
    carrega_cep();
    function carrega_cep() {
      // Obtenha o elemento pelo ID
      let cep = document.getElementById(id_local);

      if (cep) {
        pesquisacep(cep.innerText);
      } else {
        console.error("Elemento não encontrado com ID: " + id_local);
      }
    }

    function meu_callback(conteudo) {
      if (!("erro" in conteudo)) {
        //Atualiza os campos com os valores.

        let endereco = conteudo.localidade + " - " + conteudo.uf;
        document.getElementById(id_local).innerText = endereco;
        document.getElementById(id_local).style.display = "block";
      }
      else {
        //CEP não Encontrado.
        alert("CEP não encontrado.");
      }
    }

    function pesquisacep(valor) {
      // Nova variável "cep" somente com dígitos.
      var cep = valor.replace(/\D/g, '');

      // Verifica se campo cep possui valor informado.
      if (cep != "") {
        // Expressão regular para validar o CEP.
        var validacep = /^[0-9]{8}$/;

        // Valida o formato do CEP.
        if (validacep.test(cep)) {
          // Cria um elemento javascript.
          var script = document.createElement('script');

          // Sincroniza com o callback.
          script.src = 'https://viacep.com.br/ws/' + cep + '/json/?callback=meu_callback';

          // Insere script no documento e carrega o conteúdo.
          document.body.appendChild(script);
        } else {
          // CEP é inválido.
          limpa_formulário_cep();
          alert("Formato de CEP inválido.");
        }
      } else {
        // CEP sem valor, limpa formulário.
        limpa_formulário_cep();
      }
    }

  </script>

  <!-- Script API Google Maps -->
  <script th:if="${#authorization.expression('isAuthenticated()')}" th:inline="javascript">
    async function getCoordinates(address) {
      const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${address}&key=AIzaSyAc9-NedwVuG0a_UWAysE5NRK3c7ApeNgQ`);
      const data = await response.json();
      return data.results[0].geometry.location;
    }

    async function getMidPointCoordinates(address1, address2) {
      const location1 = await getCoordinates(address1);
      const location2 = await getCoordinates(address2);

      const midLat = (location1.lat + location2.lat) / 2;
      const midLng = (location1.lng + location2.lng) / 2;

      return { lat: midLat, lng: midLng };
    }

    async function inicializarMapa() {
      var address1 = /*[[${#authentication.principal.address}]]*/ '';
      var address2 = /*[[${ad.seller.address}]]*/ '';
      const pontoEncontro = await getMidPointCoordinates(address1, address2);

      //  Objeto de opções para o mapa
      var opcoesMapa = {
        center: pontoEncontro,
        zoom: 12
      };

      // Novo mapa no elemento com o ID "mapa"
      var mapa = new google.maps.Map(document.getElementById('mapa'), opcoesMapa);

      // Marcador no ponto de encontro
      var marcador = new google.maps.Marker({
        position: pontoEncontro,
        map: mapa,
        title: 'Ponto de Encontro'
      });
    }



  </script>

</body>

</html>
