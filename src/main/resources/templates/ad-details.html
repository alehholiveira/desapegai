<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{fragments :: html_header(pageTitle=${ad.title} + ' | Desapegaí')}">
    <!-- Título da página dinâmico -->
</head>

<!-- CSS Adicional Leve -->
<style>
    .ad-image {
        max-width: 100%;
        height: auto;
        border-radius: 0.25rem; /* Bordas arredondadas */
        object-fit: cover;
        max-height: 500px; /* Limita a altura máxima da imagem */
    }
    .price-detail {
        font-size: 2rem; /* Preço maior */
        font-weight: bold;
        color: #28a745; /* Verde */
        margin-bottom: 1rem;
    }
    .detail-section {
        border-top: 1px solid #eee; /* Linha separadora sutil */
        padding-top: 1rem;
        margin-top: 1rem;
    }
    #mapa {
        width: 100%; /* Garante que o mapa ocupe a largura do modal */
        height: 400px;
    }
    #botao-mapa {
        background-color: #0d6efd; /* Azul padrão do Bootstrap */
        border-color: #0d6efd;
    }
    #botao-mapa:hover {
        background-color: #0b5ed7;
        border-color: #0a58ca;
    }
</style>

<body>
    <div th:replace="~{fragments :: html_nav}"></div>

    <div class="container mt-5 mb-5">
        <div class="row g-4"> <!-- g-4 adiciona espaçamento entre colunas -->

            <!-- Coluna da Imagem -->
            <div class="col-lg-7 text-center"> <!-- Ocupa mais espaço em telas grandes -->
                 <img th:src="@{/ad-images/{id}/{photos}(id=${ad.id}, photos=${ad.photos})}"
                     class="img-fluid shadow-sm ad-image"
                     th:alt="${ad.title}">
            </div>

            <!-- Coluna de Detalhes -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm h-100"> <!-- Card para agrupar detalhes -->
                    <div class="card-body d-flex flex-column">
                        <!-- Título do Anúncio -->
                        <h1 class="h3 mb-3" th:text="${ad.title}">Título do Anúncio</h1>

                        <!-- Preço -->
                        <p class="price-detail" th:text="'R$ ' + ${#numbers.formatDecimal(ad.price, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>

                        <!-- Descrição -->
                        <div class="detail-section">
                            <h5 class="h6 text-muted mb-2">Descrição</h5>
                            <p th:text="${ad.description}">Descrição detalhada do produto...</p>
                        </div>

                        <!-- Categoria -->
                        <div class="detail-section">
                            <h5 class="h6 text-muted mb-2">Categoria</h5>
                            <p><span class="badge bg-secondary" th:text="${ad.category.name}">Categoria</span></p>
                        </div>

                        <!-- Localização e Data -->
                        <div class="detail-section">
                            <h5 class="h6 text-muted mb-2">Detalhes Adicionais</h5>
                            <!-- Usando data-cep para o script ViaCEP -->
                            <p id="address-display" class="card-text text-muted small mb-1" th:data-cep="${ad.seller.address}" style="display: none;">
                                <i class="bi bi-geo-alt-fill"></i> Carregando localização...
                            </p>
                            <p class="card-text mb-0">
                                <small class="text-muted">
                                    <i class="bi bi-calendar3"></i> Publicado em: <span th:text="${#temporals.format(ad.publicationDate, 'dd/MM/yyyy HH:mm', 'America/Sao_Paulo')}"></span>
                                </small>
                            </p>
                             <p class="card-text mb-0">
                                <small class="text-muted">
                                    <i class="bi bi-person-fill"></i> Vendedor: <span th:text="${ad.seller.username}"></span> <!-- Nome do vendedor -->
                                </small>
                            </p>
                        </div>

                        <!-- Botão do Mapa (no final) -->
                        <div class="mt-auto pt-3"> <!-- Empurra para o final -->
                            <button type="button" id="botao-mapa" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#myModal" sec:authorize="isAuthenticated()">
                                <i class="bi bi-map-fill me-2"></i> Ver Ponto de Encontro no Mapa
                            </button>
                             <p sec:authorize="!isAuthenticated()" class="text-center text-muted small mt-2">
                                <a th:href="@{/login}">Faça login</a> para ver o ponto de encontro.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal do Mapa (Estrutura Mantida) -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="mapModalLabel" aria-hidden="true"> <!-- Adicionado fade e aria -->
        <div class="modal-dialog modal-lg"> <!-- Mantido modal-lg -->
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mapModalLabel">Ponto de Encontro Sugerido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0"> <!-- Removido padding para o mapa ocupar tudo -->
                    <div id="mapa"></div> <!-- Mapa preencherá esta div -->
                </div>
                 <!-- Footer opcional, pode ser removido se não for necessário -->
                 <!-- <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div> -->
            </div>
        </div>
    </div>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Script Google Maps API (Callback ajustado) -->
    <!-- Chave API movida para variável JS para melhor organização -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const GOOGLE_MAPS_API_KEY = "SUA_CHAVE_API_AQUI"; // Substitua pela sua chave real
        /*]]>*/

        // Função para carregar o script do Google Maps dinamicamente
        function loadGoogleMapsScript() {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=initMap`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }

         // Chama o carregamento do script se o usuário estiver autenticado
         if ([[${#authorization.expression('isAuthenticated()')}]]) {
             // Adiciona um listener para inicializar o mapa SOMENTE quando o modal for exibido
             const mapModal = document.getElementById('myModal');
             let mapInitialized = false; // Flag para inicializar apenas uma vez
             mapModal.addEventListener('shown.bs.modal', function () {
                 if (!mapInitialized) {
                     loadGoogleMapsScript(); // Carrega o script do Google Maps
                     mapInitialized = true;
                 } else {
                     // Se já inicializado, talvez precise redimensionar o mapa
                     // google.maps.event.trigger(map, 'resize'); // Descomente se necessário
                 }
             });
         }

    </script>

    <!-- Script ViaCEP (Ajustado para usar data-attribute) -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const locationElement = document.getElementById('address-display'); // ID do parágrafo de endereço
        if (locationElement) {
            const cep = locationElement.getAttribute('data-cep');
            if (cep) {
                pesquisacep(cep, locationElement); // Passa o elemento
            } else {
                 locationElement.innerText = 'Endereço não informado';
                 locationElement.style.display = 'block';
            }
        }
      });

      function meu_callback_cep(conteudo, element) { // Nome diferente para evitar conflito
        if (!("erro" in conteudo)) {
          let endereco = conteudo.localidade + " - " + conteudo.uf;
          element.innerHTML = `<i class="bi bi-geo-alt-fill"></i> ${endereco}`; // Atualiza o conteúdo
          element.style.display = "block"; // Mostra o elemento
        } else {
          console.warn("CEP não encontrado:", element.getAttribute('data-cep'));
          element.innerText = "Localização indisponível";
          element.style.display = "block";
        }
      }

      function pesquisacep(valor, element) {
          var cep = valor.replace(/\D/g, '');
          if (cep != "" && /^[0-9]{8}$/.test(cep)) {
              var script = document.createElement('script');
              const callbackName = `callback_cep_${cep}_${Date.now()}`;
              window[callbackName] = function(conteudo) {
                  meu_callback_cep(conteudo, element);
                  document.body.removeChild(script);
                  delete window[callbackName];
              };
              script.src = `https://viacep.com.br/ws/${cep}/json/?callback=${callbackName}`;
              document.body.appendChild(script);
          } else {
              console.error("CEP inválido ou vazio:", valor);
              element.innerText = "CEP inválido";
              element.style.display = "block";
          }
      }
    </script>

    <!-- Script Google Maps - Lógica de Inicialização e Ponto Médio -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        let map; // Variável global para o mapa

        async function getCoordinates(address) {
            // Considerar adicionar tratamento de erro aqui (se a API falhar)
            try {
                const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(address)}&key=${GOOGLE_MAPS_API_KEY}`);
                if (!response.ok) {
                    throw new Error(`Geocoding API error: ${response.statusText}`);
                }
                const data = await response.json();
                if (data.status === 'OK' && data.results && data.results.length > 0) {
                    return data.results[0].geometry.location; // {lat: number, lng: number}
                } else {
                    console.error('Geocoding failed:', data.status, data.error_message);
                    return null; // Retorna null se não encontrar coordenadas
                }
            } catch (error) {
                 console.error('Error fetching coordinates:', error);
                 return null;
            }
        }

        async function getMidPointCoordinates(address1, address2) {
            const location1 = await getCoordinates(address1);
            const location2 = await getCoordinates(address2);

            // Se uma das localizações falhar, retorna null ou uma localização padrão
            if (!location1 || !location2) {
                console.warn("Could not get coordinates for both addresses.");
                return null; // Ou retorne um ponto central padrão, ex: centro do Brasil
            }

            const midLat = (location1.lat + location2.lat) / 2;
            const midLng = (location1.lng + location2.lng) / 2;

            return { lat: midLat, lng: midLng };
        }

        // Esta função será chamada pelo callback da API do Google Maps
        async function initMap() {
            var userAddress = /*[[${#authorization.expression('isAuthenticated()') ? #authentication.principal.address : null}]]*/ null;
            var sellerAddress = /*[[${ad.seller.address}]]*/ '';
            let centerPoint = { lat: -14.2350, lng: -51.9253 }; // Centro do Brasil como fallback
            let zoomLevel = 4; // Zoom mais afastado como fallback

            if (userAddress) {
                 const midPoint = await getMidPointCoordinates(userAddress, sellerAddress);
                 if (midPoint) {
                     centerPoint = midPoint;
                     zoomLevel = 12; // Zoom mais próximo se o ponto médio for calculado
                 } else {
                     // Tenta centralizar no endereço do vendedor se o ponto médio falhar
                     const sellerCoords = await getCoordinates(sellerAddress);
                     if (sellerCoords) {
                         centerPoint = sellerCoords;
                         zoomLevel = 11; // Um pouco mais afastado que o ponto médio
                     }
                 }
            } else {
                 // Se usuário não logado (embora o botão não deva aparecer), centraliza no vendedor
                 const sellerCoords = await getCoordinates(sellerAddress);
                 if (sellerCoords) {
                     centerPoint = sellerCoords;
                     zoomLevel = 11;
                 }
            }


            map = new google.maps.Map(document.getElementById('mapa'), {
                center: centerPoint,
                zoom: zoomLevel,
                mapTypeControl: false, // Opcional: remove controle de tipo de mapa
                streetViewControl: false // Opcional: remove street view
            });

            // Adiciona marcador apenas se o ponto médio foi calculado com sucesso
            if (userAddress && centerPoint.lat !== -14.2350) { // Verifica se não é o fallback
                 new google.maps.Marker({
                    position: centerPoint,
                    map: map,
                    title: 'Ponto de Encontro Sugerido',
                    // icon: 'url/to/custom/icon.png' // Opcional: ícone customizado
                });
            } else if (!userAddress) {
                 // Se usuário não logado, mas mapa mostrado (improvável), marca o vendedor
                 if (centerPoint.lat !== -14.2350) {
                     new google.maps.Marker({ position: centerPoint, map: map, title: 'Localização Aproximada do Vendedor'});
                 }
            }
             // Adicionar InfoWindow (opcional)
             // const infowindow = new google.maps.InfoWindow({
             //    content: "Este é um ponto de encontro sugerido.",
             //    ariaLabel: "Ponto de Encontro",
             // });
             // marker.addListener("click", () => {
             //    infowindow.open({ anchor: marker, map });
             // });
        }
        /*]]>*/
    </script>

</body>
</html>
