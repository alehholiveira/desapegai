<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: html_header(pageTitle='Criar Anúncio | Desapegaí')}"></head>
<!-- Adicionando um CSS leve para o botão, se necessário -->
<style>
    #botao-desapegar {
        background-color: #ffc107; /* Cor amarela/laranja como destaque */
        border-color: #ffc107;
        color: #212529; /* Texto escuro para contraste */
        font-weight: bold;
    }
    #botao-desapegar:hover {
        background-color: #e0a800;
        border-color: #d39e00;
    }
    /* Garante que o alerta de erro do thymeleaf seja vermelho */
    .invalid-feedback {
        display: block; /* Força a exibição quando o Thymeleaf adiciona a classe */
        color: #dc3545;
        font-size: 0.875em;
    }
</style>

<body>
    <div th:replace="~{fragments :: html_nav}"></div>

    <div class="container mt-5 mb-5"> <!-- Espaçamento superior e inferior -->
        <div class="row justify-content-center"> <!-- Centraliza a coluna -->
            <div class="col-md-8 col-lg-7"> <!-- Coluna mais estreita em telas maiores -->
                <div class="card shadow-sm border-0"> <!-- Sombra suave, sem borda -->
                    <div class="card-header bg-light border-0 pt-4 pb-3"> <!-- Header mais espaçado e claro -->
                        <h2 class="text-center mb-0"> <i class="bi bi-pencil-square me-2"></i>Criar Novo Anúncio</h2> <!-- Título com ícone (opcional) -->
                    </div>

                    <div class="card-body p-4 p-md-5"> <!-- Mais padding interno -->
                        <!-- Mensagem de Sucesso (se houver) -->
                        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            Anúncio criado com sucesso!
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <!-- Mensagem de Erro Geral (se houver, vindo do Controller) -->
                         <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form id="createAdForm" method="post" enctype="multipart/form-data" th:action="@{/anuncios/novo_anuncio/save}" th:object="${ad}" novalidate>
                            <!-- Campo Oculto User ID -->
                            <input type="hidden" name="userId" th:value="${#authentication.principal.id}" />

                            <!-- Título -->
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" id="title" placeholder="Ex: Bicicleta Caloi Aro 29" th:field="*{title}" required>
                                <label for="title">Título do Anúncio</label>
                                <div class="invalid-feedback" th:errors="*{title}">Erro no título</div>
                            </div>

                            <!-- Descrição -->
                            <div class="form-floating mb-3">
                                <textarea class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" id="description" placeholder="Descreva seu produto aqui..." style="height: 100px" th:field="*{description}" required></textarea>
                                <label for="description">Descrição</label>
                                <div class="invalid-feedback" th:errors="*{description}">Erro na descrição</div>
                            </div>

                            <!-- Preço -->
                            <label for="price" class="form-label">Preço</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">R$</span>
                                <input type="text" inputmode="decimal" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" id="price" placeholder="0,00" th:field="*{price}" required>
                                <div class="invalid-feedback" th:errors="*{price}">Erro no preço</div>
                            </div>

                            <!-- Categoria -->
                            <div class="form-floating mb-3">
                                <select class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" id="category" th:field="*{category.id}" required>
                                    <option value="" selected disabled>Selecione uma categoria</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <label for="category">Categoria</label>
                                <div class="invalid-feedback" th:errors="*{category}">Erro na categoria</div>
                            </div>

                            <!-- Imagem -->
                            <div class="mb-4">
                                <label for="image" class="form-label">Imagem Principal</label>
                                <input class="form-control" th:classappend="${#fields.hasErrors('photos')} ? 'is-invalid' : ''" type="file" id="image" name="image" accept="image/png, image/jpeg, image/webp" required>
                                <div class="form-text">Envie a melhor foto do seu produto (PNG, JPG ou WebP). Tamanho máximo: 1MB.</div>
                                <!-- Erro vindo do backend (Thymeleaf) -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('photos')}" th:errors="*{photos}">Erro na imagem</div>
                                <!-- Erro de tamanho do arquivo (JavaScript) -->
                                <div id="image-size-error" class="invalid-feedback" style="display: none;">O arquivo selecionado é muito grande. O tamanho máximo é 1MB.</div>
                            </div>

                            <!-- Botão Submit -->
                            <div class="d-grid"> <!-- d-grid faz o botão ocupar toda a largura -->
                                <button id="botao-desapegar" class="btn btn-lg" type="submit">Desapegar Agora!</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <!-- Scripts Bootstrap (mantidos) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MfZyZ1OXnGCKJv3/JBfQckuP7rfrJpOVHjq8b8f+0Cj0A0bQswe5CkXZ2MI8jM2"
        crossorigin="anonymous"></script>

    <!-- Script Customizado para Formatação e Validação -->
    <script>
        const priceInput = document.getElementById('price');
        const form = document.getElementById('createAdForm');
        const imageInput = document.getElementById('image'); // Referência ao input de imagem
        const imageSizeErrorDiv = document.getElementById('image-size-error'); // Referência ao div de erro de tamanho
        const MAX_FILE_SIZE_MB = 1; // Tamanho máximo em Megabytes
        const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024; // Tamanho máximo em Bytes

        // Formatter para moeda brasileira (BRL)... (código do formatter mantido)
        const currencyFormatter = new Intl.NumberFormat('pt-BR', {
            style: 'decimal',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
        });

        // Função para limpar e obter o valor numérico do input... (código mantido)
        function getNumericValue(value) {
            if (!value) return null;
            let cleanedValue = value.replace(/[^0-9,.]/g, '');
            cleanedValue = cleanedValue.replace(',', '.');
             const parts = cleanedValue.split('.');
             if (parts.length > 1) {
                 cleanedValue = parts.slice(0, -1).join('') + '.' + parts.slice(-1);
             }
            const number = parseFloat(cleanedValue);
            return isNaN(number) ? null : number;
        }

        // Função para formatar o valor no input... (código mantido)
        function formatInputPrice(inputElement) {
            const numericValue = getNumericValue(inputElement.value);
            if (numericValue !== null && numericValue >= 0) {
                inputElement.value = currencyFormatter.format(numericValue);
                inputElement.classList.remove('is-invalid');
                return true;
            } else if (inputElement.value === '') {
                 inputElement.classList.remove('is-invalid');
                 return false;
            } else {
                inputElement.classList.add('is-invalid');
                return false;
            }
        }

        // Função para validar o tamanho do arquivo
        function validateFileSize(inputElement) {
            if (inputElement.files && inputElement.files.length > 0) {
                const file = inputElement.files[0];
                if (file.size > MAX_FILE_SIZE_BYTES) {
                    // Arquivo muito grande
                    inputElement.classList.add('is-invalid'); // Marca o input como inválido
                    imageSizeErrorDiv.style.display = 'block'; // Mostra a mensagem de erro específica
                    inputElement.value = ''; // Limpa a seleção do arquivo inválido
                    // Opcional: Focar no campo para o usuário notar
                    // inputElement.focus();
                    return false; // Inválido
                } else {
                    // Arquivo dentro do limite
                    inputElement.classList.remove('is-invalid'); // Remove a marcação de inválido (se houver)
                    imageSizeErrorDiv.style.display = 'none'; // Esconde a mensagem de erro
                    return true; // Válido
                }
            }
            // Nenhum arquivo selecionado (pode ser válido ou inválido dependendo do 'required')
            // Se o campo for 'required', a validação do Bootstrap cuidará disso.
            imageSizeErrorDiv.style.display = 'none'; // Garante que a msg de erro de tamanho esteja escondida
            return true; // Considera válido em termos de tamanho (nenhum arquivo para verificar)
        }


        // Formata o preço quando o campo perde o foco (blur)
        priceInput.addEventListener('blur', function() {
            formatInputPrice(this);
        });

        // Valida o tamanho do arquivo quando um arquivo é selecionado
        imageInput.addEventListener('change', function() {
            validateFileSize(this);
        });


        // Adiciona validação Bootstrap no submit
        form.addEventListener('submit', event => {
            // Formata e valida o preço uma última vez
            const isPriceValid = formatInputPrice(priceInput);
            // Valida o tamanho do arquivo uma última vez
            const isFileSizeValid = validateFileSize(imageInput);

            // Verifica a validação geral do formulário E as validações customizadas
            if (!form.checkValidity() || !isPriceValid || !isFileSizeValid) {
                event.preventDefault(); // Impede o envio do formulário
                event.stopPropagation();

                // Garante que os campos inválidos sejam marcados (caso a validação inicial tenha falhado)
                if (!isPriceValid && priceInput.value !== '') {
                     priceInput.classList.add('is-invalid');
                }
                 if (!isFileSizeValid && imageInput.files.length === 0 && imageInput.required) {
                    // Se for requerido e não tiver arquivo (após limpeza por tamanho inválido, por ex.)
                    imageInput.classList.add('is-invalid');
                 } else if (!isFileSizeValid) {
                    // Se falhou por tamanho (já deve ter mostrado a msg e limpado o campo)
                    imageSizeErrorDiv.style.display = 'block';
                    imageInput.classList.add('is-invalid');
                 }

            } else {
                 // Se tudo estiver válido, converte o preço para formato numérico antes de enviar
                 const numericValue = getNumericValue(priceInput.value);
                 if (numericValue !== null) {
                     priceInput.value = numericValue.toFixed(2); // Envia com ponto decimal
                 }
            }

            form.classList.add('was-validated'); // Mostra feedback visual da validação Bootstrap
        }, false);

    </script>
</body>
</html>
