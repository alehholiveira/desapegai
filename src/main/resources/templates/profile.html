<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{fragments :: html_header(pageTitle='Meu Perfil | Desapegaí')}">
</head>

<style>
    .profile-header {
        background-color: #f8f9fa; /* Cinza claro, como o sobre-hero */
        padding: 2rem 1.5rem;
        margin-bottom: 2.5rem;
        border-radius: .3rem;
        text-align: center;
    }
    .profile-avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background-color: #e9ecef; /* Cor de fundo caso a imagem não carregue ou tenha transparência */
        margin: 0 auto 1rem auto;
        border: 3px solid #dee2e6;
        overflow: hidden; /* Garante que a imagem não ultrapasse as bordas arredondadas */
    }
    .profile-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ou 'contain' dependendo de como quer que a logo se ajuste */
    }
    .profile-card {
        border: none;
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,.075); /* Sombra mais suave */
    }
    .profile-card .card-header {
        background-color: #fff;
        border-bottom: 1px solid #eee; /* Linha separadora sutil */
        font-weight: 600;
        color: #343a40;
    }
    .info-label {
        font-weight: 500;
        color: #495057;
    }
    .info-value {
        color: #212529;
    }
    .action-buttons .btn {
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
    }
    .highlight-username {
        color: #005BFF; /* Cor de destaque */
        font-weight: bold;
    }

    .press:hover{
        background-color: white;
        color: #FF8C00;;
    }
</style>

<body>
    <div th:replace="~{fragments :: html_nav}"></div>

    <div class="container mt-5 mb-5">

        <div class="profile-header">
            <div class="profile-avatar">
                <img src="images/logobox.png" alt="Avatar do Usuário"/>
            </div>
            <h1 class="h2 mb-0">Olá, <span class="highlight-username" th:text="${#authentication.principal.name}">Nome do Usuário</span>!</h1>
            <p class="text-muted">Gerencie suas informações e atividades no DesapegAí.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card profile-card">
                    <div class="card-header">
                        <i class="bi bi-person-lines-fill me-2"></i>Informações da Conta
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-3">
                            <div class="col-sm-4 info-label">Nome Completo:</div>
                            <div class="col-sm-8 info-value" th:text="${#authentication.principal.name}">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 info-label">Nome de Usuário:</div>
                            <div class="col-sm-8 info-value" th:text="${#authentication.principal.username}">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 info-label">Email:</div>
                            <div class="col-sm-8 info-value" th:text="${#authentication.principal.email}">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 info-label">Telefone:</div>
                            <div class="col-sm-8 info-value" th:text="${#authentication.principal.phone}">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 info-label">Endereço (CEP):</div>
                            <div class="col-sm-8 info-value">
                                <span th:data-cep="${#authentication.principal.address}" id="user-address-display" style="display:none;">Carregando localização...</span>
                                <span th:text="${#authentication.principal.address}" id="user-address-cep-raw" style="display:none;"></span> <!-- Para exibir o CEP puro se ViaCEP falhar -->
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="action-buttons text-center">
                            <a th:href="@{/perfil/editar}" class="btn  col-md-5 mx-1 press" style="background-color: #FF8C00; color: white;">
                                <i class="bi bi-pencil-square me-2"></i>Editar Perfil
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer (se você tiver um fragmento de footer, adicione aqui) -->
    <!-- <div th:replace="~{fragments :: html_footer}"></div> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Script ViaCEP para exibir Cidade/UF do usuário -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const locationElement = document.getElementById('user-address-display');
        const cepRawElement = document.getElementById('user-address-cep-raw');

        if (locationElement) {
            const cep = locationElement.getAttribute('data-cep');
            if (cep && cep.trim() !== '') {
                pesquisacepParaPerfil(cep, locationElement, cepRawElement);
            } else {
                 locationElement.innerText = 'CEP não informado';
                 locationElement.style.display = 'inline'; // Mostra a mensagem
                 if(cepRawElement) cepRawElement.style.display = 'none';
            }
        }
      });

      function callbackCepPerfil(conteudo, element, rawCepElement) {
        if (!("erro" in conteudo)) {
          let endereco = conteudo.localidade + " - " + conteudo.uf + " (CEP: " + conteudo.cep.replace(/\D/g, '') + ")";
          element.innerText = endereco;
        } else {
          console.warn("CEP não encontrado para perfil:", element.getAttribute('data-cep'));
          // Mostra o CEP puro se a busca falhar
          element.innerText = rawCepElement ? rawCepElement.innerText : "CEP não encontrado";
        }
        element.style.display = 'inline'; // Mostra o elemento
        if(rawCepElement) rawCepElement.style.display = 'none'; // Esconde o CEP puro
      }

      function pesquisacepParaPerfil(valor, element, rawCepElement) {
          var cep = valor.replace(/\D/g, '');
          if (cep != "" && /^[0-9]{8}$/.test(cep)) {
              var script = document.createElement('script');
              const callbackName = `callback_cep_perfil_${cep}_${Date.now()}`;
              window[callbackName] = function(conteudo) {
                  callbackCepPerfil(conteudo, element, rawCepElement);
                  document.body.removeChild(script);
                  delete window[callbackName];
              };
              script.src = `https://viacep.com.br/ws/${cep}/json/?callback=${callbackName}`;
              document.body.appendChild(script);
          } else {
              console.error("CEP inválido ou vazio para perfil:", valor);
              element.innerText = rawCepElement ? rawCepElement.innerText : "CEP inválido";
              element.style.display = 'inline';
              if(rawCepElement) rawCepElement.style.display = 'none';
          }
      }
    </script>

</body>
</html>
